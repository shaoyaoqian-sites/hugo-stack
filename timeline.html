<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline 草图</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #fff;
      --ink: #0b1220;
      --muted: #62708a;
      --line: #e5e9f2;
      --primary: #2563eb;
      --near: #3b82f6;
      --mid: #64748b;
      --far: #94a3b8;
      --accent: #10b981;
      --rail: #dbe3f0;
      --radius: 16px;
      --shadow: 0 6px 24px rgba(22, 28, 45, .06);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"
    }

    .wrap {
      max-width: 920px;
      margin: 40px auto;
      padding: 0 20px
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px
    }

    .chip {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      cursor: pointer
    }

    .chip.active {
      border-color: var(--primary);
      color: var(--primary)
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 28px
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(var(--rail), var(--rail))
    }

    .month {
      position: relative;
      margin: 18px 0 8px;
      padding-left: 8px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .02em
    }

    .item {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin: 12px 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px
    }

    .item:before {
      content: "";
      position: absolute;
      left: -27px;
      top: 18px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary)
    }

    .type {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 14px
    }

    .title {
      font-weight: 700
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 14px
    }

    .pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      border: 1px solid var(--line)
    }

    .right {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .badge {
      font-weight: 700;
      border-radius: 999px;
      padding: 6px 10px
    }

    .near {
      background: rgba(59, 130, 246, .12);
      color: var(--near)
    }

    .mid {
      background: rgba(100, 116, 139, .12);
      color: var(--mid)
    }

    .far {
      background: rgba(148, 163, 184, .18);
      color: var(--far)
    }

    .past {
      background: rgba(148, 163, 184, .18);
      color: var(--far)
    }


    .details {
      grid-column: 1/-1;
      color: var(--muted);
      font-size: 14px
    }

    .actions {
      grid-column: 1/-1;
      display: flex;
      gap: 8px
    }

    .btn {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff
    }

    @media (max-width:640px) {
      .item {
        grid-template-columns: 1fr
      }

      .right {
        justify-content: flex-start
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>时间线</h1>
    <div class="toolbar">
      <div class="chip active" data-filter="">全部</div>
      <div class="chip" data-filter="near">近一周</div>
      <div class="chip" data-filter="past">过去</div>
      <div class="chip" data-filter="future">未来</div>
      <div class="chip" data-filter="mid">近一个月</div>
    </div>

    <section class="timeline" id="timeline">
      <!-- JS 动态生成内容 -->
    </section>
  </div>

  <script>
    // 简单工具：格式化 & 计算
    const msDay = 86400000;
    const fmt = (d) => {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    function humanDuration(ms) {
      if (ms < 60 * 1000) return `${Math.round(ms / 1000)} 秒`;
      const h = Math.floor(ms / 3600000);
      const m = Math.round((ms % 3600000) / 60000);
      if (h > 0 && m > 0) return `${h} 小时 ${m} 分`;
      if (h > 0) return `${h} 小时`;
      return `${m} 分`;
    }

    async function loadTimeline() {
      const res = await fetch('https://www.pengfeima.cn/cdn/other/json/timeline.json');
      const data = await res.json();
      // 按开始时间升序排序
      data.sort((a, b) => new Date(a.start) - new Date(b.start));
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';
      let lastMonth = '';
      data.forEach(item => {

        // 判断 item.start 是否有时区，如果没有就减去 8 小时，得到北京时间
      let start = new Date(item.start);
      if (!/([Zz]|[+-]\d{2}:?\d{2})$/.test(item.start)) {
        start = new Date(start.getTime() - 8 * 3600000);
      }
      let end = new Date(item.end);
      if (!/([Zz]|[+-]\d{2}:?\d{2})$/.test(item.end)) {
        end = new Date(end.getTime() - 8 * 3600000);
      }

        const monthLabel = `${start.getFullYear()} · ${start.getMonth() + 1} 月`;
        if (monthLabel !== lastMonth) {
          timeline.insertAdjacentHTML('beforeend', `<div class="month">${monthLabel}</div>`);
          lastMonth = monthLabel;
        }

        // 持续时间
        const dur = end - start;
        let dur_short = true;
        if (isNaN(dur) || dur < 10000) {
        } else {
            dur_short = false;
        }
        let metaHtml = '';
        metaHtml = `
          ${dur_short ? `<span class="pill">${fmt(start)}</span>` : `<span class="pill">起：${fmt(start)}</span><span class="pill">止：${fmt(end)}</span>`}
          <span class="pill" data-duration>—</span>
        `;
        timeline.insertAdjacentHTML('beforeend', `
        <article class="item" data-type="${item.type}" data-start="${item.start}" data-end="${item.end}">
          <div>
            <div class="type"><span>${item.icon || ''}</span><span class="title">${item.title}</span></div>
            <div class="meta">${metaHtml}</div>
          </div>
          <div class="right">
            <span class="badge far" data-countdown>—</span>
          </div>
          ${item.details ? `<div class="details">${item.details}</div>` : ''}
          ${item.actions ? `<div class="actions">${item.actions.map(a => `<button class="btn${a.primary ? ' primary' : ''}">${a.text}</button>`).join('')}</div>` : ''}
          ${item.note ? `<div class="details">${item.note}</div>` : ''}
        </article>
      `);
      });
    }




    loadTimeline().then(paint);
    // 初始化每个 item 的“持续时间”和“倒计时”
    function paint() {
      const now = new Date();
      document.querySelectorAll('.item').forEach(it => {
        const start = new Date(it.dataset.start);
        const end = new Date(it.dataset.end);
        const durationEl = it.querySelector('[data-duration]');
        const cdEl = it.querySelector('[data-countdown]');

        // 持续时间
        const dur = end - start;
        if (isNaN(dur) || dur < 10000) {
          durationEl.textContent = '-10';
          durationEl.style.display = 'none';
        } else {
            if (dur >= msDay) {
            durationEl.textContent = `${Math.round(dur / msDay)} 天`;
            } else {
            durationEl.textContent = humanDuration(Math.max(0, dur));
            }
        }

        // 倒计时
        const diff = start - now;
        const days = Math.ceil(diff / msDay);
        let label = days > 0 ? `${days} 天后` : (diff > -msDay ? '今天' : `${Math.abs(Math.floor(diff / msDay))} 天前`);
        cdEl.textContent = label;
        it.removeAttribute('data-tenses');
        cdEl.classList.remove('near', 'mid', 'far', 'past');
        if (days <= 7 && days > 0) {
            cdEl.classList.add('near');
          it.setAttribute('data-tenses', 'near');
        } else if (days <= 30 && days > 7) {
            cdEl.classList.add('mid');
          it.setAttribute('data-tenses', 'mid');
        } else if (days > 30) {
            cdEl.classList.add('far');
          it.setAttribute('data-tenses', 'far');
        } else if (diff <= 0) {
            cdEl.classList.add('past');
          it.setAttribute('data-tenses', 'past');
        }
      });
    }

    // 过滤器
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const f = chip.dataset.filter;
        document.querySelectorAll('.item').forEach(it => {
            // 过滤逻辑
            if (f === '') {
            it.style.display = '';
            } else {
            it.style.display = it.getAttribute('data-tenses') === f ? '' : 'none';
            }
        });
      });
    });

    // 定时刷新倒计时（每分钟）
    paint();
    setInterval(paint, 60000);
  </script>
</body>

</html>
